<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="120" y1="80" x2="392" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="160" y1="120" x2="352" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="102" stroke="#10b981" stroke-opacity="0.25" stroke-width="6" />

  <!-- Outer Shield -->
  <path
    d="M256 68L408 124V248C408 346 342 420 256 448C170 420 104 346 104 248V124L256 68Z"
    fill="url(#shieldGrad)"
    stroke="url(#goldGrad)"
    stroke-width="14"
    stroke-linejoin="round"
  />

  <!-- Inner Dark Shield (Perisai Pancasila) -->
  <path
    d="M256 98L378 143V245C378 325 326 387 256 412C186 387 134 325 134 245V143L256 98Z"
    fill="#090d16"
  />

  <!-- Quadrant Lines of Perisai -->
  <path d="M256 98V412" stroke="#1e293b" stroke-width="6" />
  <path d="M134 245H378" stroke="#1e293b" stroke-width="6" />

  <!-- Center Star Shield & Bintang Ketuhanan -->
  <rect
    x="196"
    y="185"
    width="120"
    height="120"
    rx="22"
    fill="#0f172a"
    stroke="url(#goldGrad)"
    stroke-width="8"
  />
  <path
    d="M256 202L269.9 230.2L301 234.7L278.5 256.6L283.8 287.6L256 273L228.2 287.6L233.5 256.6L211 234.7L242.1 230.2L256 202Z"
    fill="url(#goldGrad)"
  />

  <!-- Top Ribbon TKA Badge -->
  <rect x="192" y="424" width="128" height="38" rx="19" fill="url(#goldGrad)" />
  <text
    x="256"
    y="450"
    text-anchor="middle"
    fill="#090d16"
    font-family="system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="24"
    letter-spacing="2"
  >TKA VI</text>
</svg>
